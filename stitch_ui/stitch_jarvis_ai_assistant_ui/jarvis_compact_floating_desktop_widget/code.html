<!-- Real-Time Micro-Interaction Scripts for Overlay Mode -->
<script>
    (function initJarvisHUD() {
      // Live digital clock simulation
      const clockEl = document.getElementById('liveClock');
      function updateTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        hours = hours % 12 || 12;
        if (clockEl) {
          clockEl.textContent = hours + ':' + minutes;
        }
      }
      updateTime();
      setInterval(updateTime, 10000);

      // Orb Acoustic State Toggle (Idle vs Listening)
      const orbBtn = document.getElementById('orbButton');
      const orbWave = document.getElementById('orbWave');
      const orbStatus = document.getElementById('orbStatus');
      const orbSub = document.getElementById('orbSubtext');
      let isListening = false;

      if (orbBtn) {
        orbBtn.addEventListener('click', () => {
          isListening = !isListening;
          if (isListening) {
            orbStatus.innerHTML = '<span class="text-primary font-bold">Listening...</span><span class="w-1.5 h-1.5 rounded-full bg-primary animate-ping"></span>';
            orbSub.textContent = 'Voice capture stream active • Speak now';
            orbBtn.classList.add('shadow-[0_0_48px_rgba(83,225,111,0.6)]');
            orbWave.classList.add('text-tertiary');
            orbWave.classList.remove('text-primary');
          } else {
            orbStatus.innerHTML = '<span>Jarvis Online</span><span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>';
            orbSub.textContent = 'Tap orb to toggle active microphone';
            orbBtn.classList.remove('shadow-[0_0_48px_rgba(83,225,111,0.6)]');
            orbWave.classList.remove('text-tertiary');
            orbWave.classList.add('text-primary');
          }
        });
      }

      // Volume Mute Toggle
      const muteBtn = document.getElementById('muteBtn');
      const volFill = document.getElementById('volFill');
      const volLabel = document.getElementById('volLabel');
      let isMuted = false;

      if (muteBtn && volFill && volLabel) {
        muteBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          if (isMuted) {
            muteBtn.textContent = 'volume_off';
            muteBtn.classList.add('text-error');
            volFill.style.width = '0%';
            volLabel.textContent = '0%';
          } else {
            muteBtn.textContent = 'volume_up';
            muteBtn.classList.remove('text-error');
            volFill.style.width = '52%';
            volLabel.textContent = '52%';
          }
        });
      }

      // Pin button toggle
      const pinBtn = document.getElementById('pinBtn');
      let isPinned = true;
      if (pinBtn) {
        pinBtn.addEventListener('click', () => {
          isPinned = !isPinned;
          if (isPinned) {
            pinBtn.classList.add('bg-primary/15', 'text-primary');
            pinBtn.classList.remove('text-on-surface-variant');
            pinBtn.title = 'Always on Top (Active)';
          } else {
            pinBtn.classList.remove('bg-primary/15', 'text-primary');
            pinBtn.classList.add('text-on-surface-variant');
            pinBtn.title = 'Pin Window';
          }
        });
      }
    })();
  </script>
